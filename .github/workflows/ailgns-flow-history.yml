name: AILGNS Flow History

on:
  workflow_dispatch:

  # 定时由 Cloudflare 定时器触发（cloudflare/cron-worker.js），GitHub 自带的 schedule 被严重限流

permissions:
  contents: write

concurrency:
  group: monita-repository-writer
  cancel-in-progress: false

jobs:
  ailgns-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update AILGNS daily flow history
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u ailgns_flow_history.py

      - name: Update AILGNS daily deposit files (for team growth lookup)
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u ailgns_deposit_index.py

      - name: Save flow history
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ailgns_flows.json data/deposits
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          git commit -m "Update AILGNS flow history and deposits"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
