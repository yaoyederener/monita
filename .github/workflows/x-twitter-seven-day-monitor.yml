name: Monitor X accounts for 7 days

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: x-twitter-seven-day-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check X and notify Telegram
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: python x-twitter-monitor/monitor.py

      - name: Save delivery checkpoint
        if: always()
        run: |
          if git diff --quiet -- x-twitter-monitor/data/state.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-twitter-monitor/data/state.json
          git commit -m "chore: update X monitor checkpoint"
          git push

      - name: Disable completed monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if jq -e '.completed == true' x-twitter-monitor/data/state.json >/dev/null; then
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/x-twitter-seven-day-monitor.yml/disable"
            echo "Seven-day monitor disabled"
          fi
  
