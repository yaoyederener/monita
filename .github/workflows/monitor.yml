name: IBS Monitor

on:

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:


jobs:

  monitor:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install
        run: |
          pip install requests


      - name: Run Monitor

        env:

          BSCSCAN_KEY: ${{ secrets.BSCSCAN_KEY }}

          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

          CHAT_ID: ${{ secrets.CHAT_ID }}


        run: |

          python monitor.py
