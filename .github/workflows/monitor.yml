name: IBS Pool Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

# 两个监控统一使用同一个并发组，避免同时推送 main 分支
concurrency:
  group: monita-repository-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IBS monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BSC_RPC: ${{ secrets.BSC_RPC }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u monitor.py

      - name: Save last scanned block
        shell: bash
        run: |
          set -e

          echo "检查是否有状态文件变化"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 添加 monitor.py 运行后产生的所有状态变化
          git add -A

          if git diff --cached --quiet; then
            echo "没有状态变化，无需提交"
            exit 0
          fi

          git commit -m "Update last scanned block [skip ci]"

          # 即使运行期间远程仓库发生变化，也会自动同步和重试
          for attempt in 1 2 3 4 5; do
            echo "第 ${attempt} 次尝试同步并推送"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "IBS扫描状态保存成功"
                exit 0
              fi
            else
              echo "Rebase发生冲突，取消本次Rebase"
              git rebase --abort || true
            fi

            echo "推送失败，稍后重试"
            sleep $((attempt * 5))
          done

          echo "连续5次推送失败"
          exit 1
