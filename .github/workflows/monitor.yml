name: BSC Token Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install web3 requests
          python -m pip show web3

      - name: Check secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN 没有读取到"
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "CHAT_ID 没有读取到"
            exit 1
          fi

          echo "BOT_TOKEN 已读取"
          echo "CHAT_ID 已读取"

      - name: Run monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BSCSCAN_KEY: ${{ secrets.BSCSCAN_KEY }}
          FIRST_RUN_LOOKBACK: "200"
          MAX_BLOCKS_PER_RUN: "3000"
          LOG_BATCH_SIZE: "500"
        run: |
          python monitor.py

      - name: Save last scanned block
        if: success()
        run: |
          if [ ! -f last_block.txt ]; then
            echo "没有 last_block.txt"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_block.txt

          if git diff --cached --quiet; then
            echo "区块没有变化"
          else
            git commit -m "Update last scanned block"
            git push
          fi
