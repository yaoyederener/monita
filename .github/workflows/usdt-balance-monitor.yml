name: BSC USDT Balance Monitor

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron uses UTC. This runs every 5 minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bsc-usdt-balance-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-usdt.txt

      - name: Check USDT balance
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BSC_RPC: ${{ secrets.BSC_RPC }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u usdt_balance_monitor.py

      - name: Save updated balance
        run: |
          if git diff --quiet -- data/usdt_balance.json; then
            echo "余额状态未变化，无需提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/usdt_balance.json
          git commit -m "Update monitored USDT balance [skip ci]"
          git pull --rebase
          git push
