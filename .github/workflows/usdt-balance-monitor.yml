name: BSC USDT Balance Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

# 必须与IBS工作流使用完全相同的并发组名称
concurrency:
  group: monita-repository-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-usdt.txt

      - name: Check USDT balance
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BSC_RPC: ${{ secrets.BSC_RPC }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u usdt_balance_monitor.py

      - name: Save updated USDT balance
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 这里只提交USDT余额状态文件
          git add data/usdt_balance.json

          if git diff --cached --quiet; then
            echo "USDT余额没有变化，无需提交"
            exit 0
          fi

          git commit -m "Update monitored USDT balance [skip ci]"

          for attempt in 1 2 3 4 5; do
            echo "第 ${attempt} 次尝试同步并推送"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "USDT余额状态保存成功"
                exit 0
              fi
            else
              echo "Rebase发生冲突，取消本次Rebase"
              git rebase --abort || true
            fi

            echo "推送失败，稍后重试"
            sleep $((attempt * 5))
          done

          echo "连续5次推送失败"
          exit 1
