name: POTS Effective Funds Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

# Keep repository-writing workflows serialized.
concurrency:
  group: monita-repository-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-usdt.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-usdt.txt

      - name: Run unit tests
        run: python -m unittest -v test_usdt_balance_monitor.py test_pots_effective_monitor.py

      - name: Check POTS core funds
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BSC_RPC: ${{ secrets.BSC_RPC }}
          REPORT_INTERVAL_MINUTES: ${{ vars.POTS_FLOW_REPORT_MINUTES || '60' }}
          IMMEDIATE_TREASURY_CHANGE_USDT: ${{ vars.POTS_IMMEDIATE_TREASURY_USDT || '10000' }}
          IMMEDIATE_SUPPLY_CHANGE_IBS: ${{ vars.POTS_IMMEDIATE_SUPPLY_IBS || '1' }}
          CONFIRMATION_BLOCKS: "3"
          PYTHONUNBUFFERED: "1"
        run: python -u pots_effective_monitor.py

      - name: Save updated flow state and history
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/pots_effective_state.json

          if git diff --cached --quiet; then
            echo "尚未到报告时间，状态无需提交"
            exit 0
          fi

          git commit -m "Update POTS core funds state [skip ci]"

          for attempt in 1 2 3 4 5; do
            echo "第 ${attempt} 次尝试同步并推送"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "POTS USDT资金流状态保存成功"
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            sleep $((attempt * 5))
          done

          echo "连续5次推送失败"
          exit 1
