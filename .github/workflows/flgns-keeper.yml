name: FLGNS isolated OTC refunds and fee split

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Refund old/new orders and split verified FLGNS/RM fee income
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: otc-refund-keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install eth-account==0.13.4 eth-abi==5.2.0
      - name: Verify fee ledger migration and receipt matching offline
        run: python -m unittest discover -s flgns/bilateral/ops -p test_keeper_v2.py
      - name: Recover the combined state, or its original V1 checkpoint once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prior_url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=flgns-bilateral04-keeper-state&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].archive_download_url // empty')
          if [ -z "$prior_url" ]; then
            prior_url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=flgns-keeper-state&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].archive_download_url // empty')
          fi
          if [ -n "$prior_url" ]; then
            gh api "$prior_url" > "$RUNNER_TEMP/flgns-combined-state.zip"
            python - <<'PY'
          import os, zipfile
          from pathlib import Path
          allowed = {'keeper-state.json', 'keeper-transactions.json'}
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'flgns-combined-state.zip') as archive:
              names = archive.namelist()
              for filename in allowed:
                  matches = [name for name in names if Path(name).name == filename]
                  if len(matches) > 1:
                      raise SystemExit('Ambiguous keeper state artifact')
                  if matches:
                      Path('flgns/bilateral/ops', filename).write_bytes(archive.read(matches[0]))
          PY
          fi
      - name: Complete read-only scan of both immutable versions
        if: inputs.execute != true && github.event_name != 'schedule'
        run: python flgns/bilateral/ops/keeper.py
      - name: Refund both versions and split verified FLGNS/RM fees
        if: inputs.execute == true || github.event_name == 'schedule'
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
        run: python flgns/bilateral/ops/keeper.py --execute
      - name: Preserve only this combined checkpoint and journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flgns-bilateral04-keeper-state
          path: |
            flgns/bilateral/ops/keeper-state.json
            flgns/bilateral/ops/keeper-transactions.json
          if-no-files-found: warn
          retention-days: 90
