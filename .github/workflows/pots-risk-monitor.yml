name: POTS Exit Risk Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: pots-exit-risk-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pots-risk.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pots-risk.txt

      - name: Run POTS risk monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BSC_RPC: ${{ secrets.BSC_RPC }}
          PYTHONUNBUFFERED: "1"
          LOCAL_TIMEZONE: "America/Vancouver"
          DAILY_REPORT_HOUR: "20"
        run: |
          python -u pots_risk_monitor.py

      - name: Save monitor state
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/pots_risk_state.json)" ]; then
            echo "监控状态没有变化，无需提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/pots_risk_state.json
          git commit -m "Update POTS risk monitor state [skip ci]"

          # Handle a rare race with another workflow commit.
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Push failed, retry $attempt/3"
            sleep $((attempt * 3))
          done

          echo "Unable to push state after 3 retries"
          exit 1
