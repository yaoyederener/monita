name: FLGNS deploy four new OTC markets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the saved plan, or deploy exactly that plan
        type: choice
        options: [verify, deploy]
        default: verify

permissions:
  contents: read
  actions: read

# Must be identical to the existing keeper's group: no concurrent signer nonce.
concurrency:
  group: otc-refund-keeper
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install signing and ABI libraries
        run: python -m pip install eth-account==0.13.4 eth-abi==5.2.0
      - name: Recover only the v2 live plan and its journal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prior_url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=flgns-deployment-v2-journal&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].archive_download_url // empty')
          if [ -z "$prior_url" ]; then
            prior_url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=flgns-deployment-v2-plan&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].archive_download_url // empty')
          fi
          if [ -n "$prior_url" ]; then
            gh api "$prior_url" > "$RUNNER_TEMP/flgns-v2-recovery.zip"
            python - <<'PY'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'flgns-v2-recovery.zip') as archive:
              names = archive.namelist()
              if names.count('live-deployment-plan.json') != 1:
                  raise SystemExit('Prior v2 artifact lacks one unambiguous live plan; recover it before retrying')
              for name in ['live-deployment-plan.json', 'deployment.json']:
                  if names.count(name) > 1:
                      raise SystemExit('Ambiguous v2 artifact entries')
                  if name in names:
                      Path('flgns/ops', name).write_bytes(archive.read(name))
          PY
          fi
      - name: Prepare live plan under signer lock or verify recovered fixed plan
        run: python flgns/ops/deploy.py --plan flgns/ops/live-deployment-plan.json
      - name: Persist fixed v2 plan before any broadcast
        uses: actions/upload-artifact@v4
        with:
          name: flgns-deployment-v2-plan
          path: flgns/ops/live-deployment-plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Deploy only saved nonce and address plan
        if: inputs.mode == 'deploy'
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
        run: python flgns/ops/deploy.py --plan flgns/ops/live-deployment-plan.json --broadcast
      - name: Preserve live plan plus journal even if a receipt or RPC fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flgns-deployment-v2-journal
          path: |
            flgns/ops/live-deployment-plan.json
            flgns/ops/deployment.json
          if-no-files-found: warn
          retention-days: 90
