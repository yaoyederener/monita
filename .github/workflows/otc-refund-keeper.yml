name: OTC Refund Keeper

on:
  workflow_dispatch:
    inputs:
      debox_test:
        description: "立刻往 DeBox 群发一条挂单播报（测试）"
        type: boolean
        default: false
      kv_backup:
        description: "立刻备份一次 KV 并发邮件"
        type: boolean
        default: false
      mail_test:
        description: "立刻发一封测试邮件"
        type: boolean
        default: false

  # 定时由 Cloudflare 定时器触发（cloudflare/cron-worker.js），GitHub 自带的 schedule 被严重限流

permissions:
  contents: write
  actions: write

# 站长 2026-11-28「太慢了吧？」：以前整个流程只许一份在跑（流程级 concurrency），refund 一跑 6～9 分钟，下一轮代注册就得排队等它，
# 中间好几分钟没人接代点的单。现在不在流程级排队，改成每个任务各排各的（fast / reg / refund 各有自己的 concurrency 组），
# 同一种任务照样绝不两份同时跑，代注册不再被 refund 拖住。

jobs:
  # ⚡ 极速预言家：结算 + 发奖，单独一个任务，和下面的 refund 并行（站长 2026-11-14「做成秒发」）。
  #   每期在整 10 分钟结束。开奖区块等链上最终确认（这条链约 1 秒，2026-11-28 从等 20 个区块改过来，见 fast_oracle.py 的 safe_block）。
  #   定时器每 5 分钟（约第 51 秒）触发一次：
  #   · 离本期结束不到 5 分半 → 先等着，卡在「结束后第 4 秒」结算发奖，再每 4 秒补两次（防节点慢）。
  #   · 本期刚结束不到 4 秒（排队排到这时才开始）→ 等到第 4 秒再跑（2026-11-28 #528：以前这时马上扫一遍、开奖还没确认，空跑退出，晚了 5 分钟）。
  #   · 离本期结束还早（上一期刚结束）→ 马上补扫一遍，兜底。
  #   站长服务器上的常驻发奖程序（fast_oracle.py --loop）在线时，这里自动只做后备：只补发结束超过 3 分钟还没发的（看它在网站的报到，见 HB_PREFIX）。
  #   发没发过只认链上的发奖记录，重复跑不会重复发；同一时间只允许一个极速任务在跑（concurrency）。
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    concurrency:
      group: fast-oracle
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signer
        run: pip install "eth-account==0.13.4"

      - name: Fast oracle - settle and pay winners right after each draw
        continue-on-error: true
        timeout-minutes: 7
        shell: bash
        env:
          FAST_POOL_KEY: ${{ secrets.FAST_POOL_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OPS_EMAILS: ${{ secrets.OPS_EMAILS }}
          PYTHONUNBUFFERED: "1"
        run: |
          now=$(date +%s); since=$(( now % 600 )); to_end=$(( 600 - since ))
          if [ "$since" -lt 4 ]; then wait=$(( 4 - since )); else wait=$(( to_end + 4 )); fi
          if [ "$wait" -le 330 ]; then
            echo "离开奖后第 4 秒还有 ${wait} 秒：等到那时再结算发奖"
            sleep "$wait"
            for i in 1 2 3; do
              echo "== 第 $i 次，$(date -u +%H:%M:%S) UTC"
              python -u fast_oracle.py --run || true
              if [ "$i" -lt 3 ]; then sleep 4; fi
            done
          else
            echo "离本期结束还有 ${to_end} 秒：现在补扫一遍"
            python -u fast_oracle.py --run
          fi

      - name: Save fast oracle state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/fast_oracle.json ]; then git add data/fast_oracle.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Update fast oracle state"
          for i in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done

  # 🤖 代注册机器人（批量注册「交给机器人代点」）+ 代烧机器人：单独一个任务，和 refund 并行（站长 2026-11-14：代点要快）。
  #   原来排在 5 分钟任务里，客户下单后最长要等 5 分钟才开始注册。现在这个任务一起来先跑一遍代烧，然后 4 分钟里每 5 秒看一次有没有新的代注册委托（2026-11-28 从 10 秒改成 5 秒）。
  #   两个机器人共用同一个钱包（REG_KEY），所以放在同一个任务里一前一后跑，绝不并行；同一时间只允许一个 reg 任务（concurrency）。
  reg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: reg-bot
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signer
        run: pip install "eth-account==0.13.4"

      - name: Burn bot - burn names for jackpot winners who delegated (approve once, bot burns)
        continue-on-error: true
        timeout-minutes: 4
        env:
          REG_KEY: ${{ secrets.REG_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u burn_bot.py

      - name: Reg bot - register names for customers who delegated, checking every 5 seconds
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          REG_KEY: ${{ secrets.REG_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          end=$(( $(date +%s) + 285 ))  # 2026-11-28：240 → 285 秒，和下一轮（5 分钟后触发、排在这一轮后面）接上，中间不留空
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            n=$(( n + 1 ))
            python -u reg_bot.py > /tmp/reg.log 2>&1 || true
            if ! grep -q "没有待办" /tmp/reg.log; then echo "== 第 $n 次，$(date -u +%H:%M:%S) UTC"; cat /tmp/reg.log; fi
            sleep 5  # 站长 2026-11-28「这个过程有点慢」：10 秒 → 5 秒，客户下单后更快开始
          done
          echo "这一轮看了 $n 次"

  refund:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: otc-refund
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signer
        run: pip install "eth-account==0.13.4"

      - name: Refund expired OTC orders
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u otc_refund_keeper.py

      - name: Send a test email
        if: ${{ inputs.mail_test }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python -c "import notify_mail; ok = notify_mail.send('AiLGNS 服务站：测试邮件', '邮件通知已经设置好了。以后有新挂单、收到付款、完成分账，都会发到这个邮箱。'); raise SystemExit(0 if ok else 1)"

      # 站长 2026-11-07：分账暂停（要加人、改比例，改成链下分账表后再开）。收入照常进收款钱包 0xedb9，只是不分。
      # 恢复：GitHub 仓库 Settings → Secrets and variables → Actions → Variables 新建 SPLIT_ON = 1
      - name: Split new OTC fees 30/40/30
        if: ${{ always() && vars.SPLIT_ON == '1' }}
        continue-on-error: true
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          OPS_EMAILS: ${{ secrets.OPS_EMAILS }}
          PYTHONUNBUFFERED: "1"
        run: python -u otc_fee_split.py

      - name: Auto-match crossing OTC orders (profit goes to the buyback contract)
        if: always()
        continue-on-error: true
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u otc_matcher.py

      - name: Oracle prize - hold back 20% of domain income and pay winners (must run before buyback)
        if: always()
        continue-on-error: true
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          POOL_KEY: ${{ secrets.POOL_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OPS_EMAILS: ${{ secrets.OPS_EMAILS }}
          PYTHONUNBUFFERED: "1"
        run: python -u oracle_prize.py

      # 🏆 OTC 手续费周榜（站长 2026-11-15）：叫网站结算 + 从周榜专用钱包发奖。没配 WEEKLY_KEY 时只结算、不发钱
      - name: Weekly OTC fee board - settle and pay from the dedicated wallet
        if: always()
        continue-on-error: true
        env:
          WEEKLY_KEY: ${{ secrets.WEEKLY_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u weekly_prize.py

      # ⚡ 极速预言家的结算发奖挪到下面单独的 fast 任务里了（站长 2026-11-14「做成秒发」）：这里不再跑，免得两处同时发奖

      # 🤖 代注册、代烧机器人挪到上面单独的 reg 任务里了（站长 2026-11-14：代点要快）：这里不再跑，免得两处同时用同一个钱包发交易

      - name: Med nag - owner medication check-in reminder (10:00 / 22:00 BJT) until checked
        if: always()
        continue-on-error: true
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: curl -s -m 20 "https://ailgns.dev/api/med?nag=1&key=$BACKUP_KEY" | sed 's/"key"[^,}]*//' || true

      - name: Oracle anchor - write today's prediction fingerprint on-chain after the 15:00 BJT cutoff (from 15:16)
        if: always()
        continue-on-error: true
        env:
          POOL_KEY: ${{ secrets.POOL_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u oracle_anchor.py

      - name: Buy back AiLGNS with Anubis income and split 40/30/30
        if: ${{ always() && vars.SPLIT_ON == '1' }}
        continue-on-error: true
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OPS_EMAILS: ${{ secrets.OPS_EMAILS }}
          PYTHONUNBUFFERED: "1"
        run: python -u otc_buyback.py

      - name: EVM arbitrage (OTC <-> DEX, own wallet 0x06cc, min profit 1 DAI; ARB_ON=1 to go live, else dry-run)
        if: always()
        continue-on-error: true
        env:
          ARB_KEY: ${{ secrets.ARB_KEY }}
          ARB_MIN_PROFIT: ${{ vars.ARB_MIN_PROFIT || '1' }}
          ARB_MAX_DAI: ${{ vars.ARB_MAX_DAI || '300' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ vars.ARB_ON }}" = "1" ]; then python -u arb_keeper.py; else python -u arb_keeper.py --dry-run; fi

      - name: Bid maker (dry-run bookkeeping always; LIVE only when repo variable BID_ON=1, wallet 0x06cc via ARB_KEY)
        if: always()
        continue-on-error: true
        env:
          BID_SIZE: ${{ vars.BID_SIZE || '5' }}
          BID_MARGIN: ${{ vars.BID_MARGIN || '0.002' }}
          BID_ON: ${{ vars.BID_ON || '0' }}
          BID_RESET: ${{ vars.BID_RESET || '' }}
          BID_MAX_LOSS: ${{ vars.BID_MAX_LOSS || '20' }}
          ARB_KEY: ${{ vars.BID_ON == '1' && secrets.ARB_KEY || '' }}
          PYTHONUNBUFFERED: "1"
        run: python -u bid_maker.py

      - name: Sell Polygon income to DAI and bridge it to Anubis for the buyback
        if: always()
        continue-on-error: true
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OPS_EMAILS: ${{ secrets.OPS_EMAILS }}
          PYTHONUNBUFFERED: "1"
        run: python -u polygon_bridge.py

      - name: Broadcast OTC orders to DeBox group
        # 营销群只发网站的每小时播报（挂单、好单、成交合成一条，站长要求）；这里只在手动测试时运行
        if: ${{ always() && inputs.debox_test }}
        continue-on-error: true
        env:
          DEBOX_API_KEY: ${{ secrets.DEBOX_API_KEY }}
          DEBOX_API_SECRET: ${{ secrets.DEBOX_API_SECRET }}
          DEBOX_GROUP_ID: ${{ secrets.DEBOX_GROUP_ID }}
          DEBOX_SUMMARY_HOURS: ${{ vars.DEBOX_SUMMARY_HOURS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: python -u otc_debox_broadcast.py ${{ inputs.debox_test && '--test' || '' }}

      - name: Daily KV backup by email (members, VIP transfers, pixel board)
        if: always()
        continue-on-error: true
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: python -u kv_backup.py ${{ inputs.kv_backup && '--force' || '' }}

      - name: Check ailgns.dev for tampering (foreign scripts, unknown addresses)
        if: always()
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: python -u site_guard.py

      - name: Warn when the keeper wallet runs low on gas
        if: always()
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: python -u gas_alert.py

      - name: Save broadcast and fee split state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 一个一个加：某个文件还没生成时（比如 gas_alert.json），不能连累别的状态文件都存不上（之前就因为这样每 5 分钟重发一次邮件）
          for f in data/otc_broadcast.json data/fee_split.json data/buyback.json data/oracle_prize.json data/weekly_prize.json data/fast_oracle.json data/kv_backup.json data/site_guard.json data/gas_alert.json data/polygon_bridge.json data/arb.json data/order_seen.json data/bid_maker.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "Update OTC broadcast and fee split state"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done

      - name: Notify order owners on DeBox (fills, cancels, refunds)
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 120 https://ailgns.dev/api/otc-watch || true

      - name: Announce operating-fee payouts to the ops DeBox group
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 120 https://ailgns.dev/api/ops-watch || true

      - name: Loan notices on DeBox (fund/take/repay/default, due reminders, group post)
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 120 https://ailgns.dev/api/loan-watch || true

      - name: Daily stats report to the internal ops DeBox group
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 120 https://ailgns.dev/api/daily-stats || true

      - name: Start big team builds when ailgns.dev needs them
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          due=$(curl -s --max-time 30 https://ailgns.dev/api/bigroots | python -c "import json,sys; print(len(json.load(sys.stdin)['due']))" || echo 0)
          echo "待生成的超大团队：$due"
          [ "$due" = "0" ] && exit 0
          busy=$(gh run list -R "${{ github.repository }}" -w big-team-build.yml --json status -q '[.[] | select(.status != "completed")] | length')
          [ "$busy" != "0" ] && { echo "已经在生成中"; exit 0; }
          gh workflow run big-team-build.yml -R "${{ github.repository }}"

      - name: Pre-build member structure diagrams on ailgns.dev
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 280 https://ailgns.dev/api/refresh || true
