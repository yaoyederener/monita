name: OTC Refund Keeper

on:
  workflow_dispatch:
    inputs:
      debox_test:
        description: "立刻往 DeBox 群发一条挂单播报（测试）"
        type: boolean
        default: false
      kv_backup:
        description: "立刻备份一次 KV 并发邮件"
        type: boolean
        default: false
      mail_test:
        description: "立刻发一封测试邮件"
        type: boolean
        default: false

  # 定时由 Cloudflare 定时器触发（cloudflare/cron-worker.js），GitHub 自带的 schedule 被严重限流

permissions:
  contents: write
  actions: write

concurrency:
  group: otc-refund-keeper
  cancel-in-progress: false

jobs:
  # ⚡ 极速预言家：结算 + 发奖，单独一个任务，和下面的 refund 并行（站长 2026-11-14「做成秒发」）。
  #   每期在整 10 分钟结束，开奖数字要等 20 个区块确认（约 21 秒）。定时器每 5 分钟（约第 51 秒）触发一次：
  #   · 离本期结束不到 5 分半 → 先等着，卡在「结束后第 23 秒」结算发奖，再补两次（防节点慢）。中奖的人大约开奖后半分钟到一分钟收到。
  #   · 离本期结束还早（上一期刚结束）→ 马上补扫一遍，兜底。
  #   发没发过只认链上的发奖记录，重复跑不会重复发；同一时间只允许一个极速任务在跑（concurrency）。
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    concurrency:
      group: fast-oracle
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signer
        run: pip install "eth-account==0.13.4"

      - name: Fast oracle - settle and pay winners right after each draw
        continue-on-error: true
        timeout-minutes: 7
        shell: bash
        env:
          FAST_POOL_KEY: ${{ secrets.FAST_POOL_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OPS_EMAILS: ${{ secrets.OPS_EMAILS }}
          PYTHONUNBUFFERED: "1"
        run: |
          now=$(date +%s); to_end=$(( 600 - now % 600 )); wait=$(( to_end + 23 ))
          if [ "$wait" -le 330 ]; then
            echo "离本期结束还有 ${to_end} 秒：等到开奖后第 23 秒再结算发奖"
            sleep "$wait"
            for i in 1 2 3; do
              echo "== 第 $i 次，$(date -u +%H:%M:%S) UTC"
              python -u fast_oracle.py --run || true
              if [ "$i" -lt 3 ]; then sleep 8; fi
            done
          else
            echo "离本期结束还有 ${to_end} 秒：现在补扫一遍"
            python -u fast_oracle.py --run
          fi

      - name: Save fast oracle state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/fast_oracle.json ]; then git add data/fast_oracle.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Update fast oracle state"
          for i in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            sleep 4
          done

  refund:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signer
        run: pip install "eth-account==0.13.4"

      - name: Refund expired OTC orders
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u otc_refund_keeper.py

      - name: Send a test email
        if: ${{ inputs.mail_test }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python -c "import notify_mail; ok = notify_mail.send('AiLGNS 服务站：测试邮件', '邮件通知已经设置好了。以后有新挂单、收到付款、完成分账，都会发到这个邮箱。'); raise SystemExit(0 if ok else 1)"

      # 站长 2026-11-07：分账暂停（要加人、改比例，改成链下分账表后再开）。收入照常进收款钱包 0xedb9，只是不分。
      # 恢复：GitHub 仓库 Settings → Secrets and variables → Actions → Variables 新建 SPLIT_ON = 1
      - name: Split new OTC fees 30/40/30
        if: ${{ always() && vars.SPLIT_ON == '1' }}
        continue-on-error: true
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          OPS_EMAILS: ${{ secrets.OPS_EMAILS }}
          PYTHONUNBUFFERED: "1"
        run: python -u otc_fee_split.py

      - name: Auto-match crossing OTC orders (profit goes to the buyback contract)
        if: always()
        continue-on-error: true
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u otc_matcher.py

      - name: Oracle prize - hold back 20% of domain income and pay winners (must run before buyback)
        if: always()
        continue-on-error: true
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          POOL_KEY: ${{ secrets.POOL_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OPS_EMAILS: ${{ secrets.OPS_EMAILS }}
          PYTHONUNBUFFERED: "1"
        run: python -u oracle_prize.py

      # ⚡ 极速预言家的结算发奖挪到下面单独的 fast 任务里了（站长 2026-11-14「做成秒发」）：这里不再跑，免得两处同时发奖

      - name: Reg bot - register names for customers who delegated (batch step 2)
        if: always()
        continue-on-error: true
        env:
          REG_KEY: ${{ secrets.REG_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u reg_bot.py

      - name: Burn bot - burn names for jackpot winners who delegated (approve once, bot burns)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        env:
          REG_KEY: ${{ secrets.REG_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u burn_bot.py

      - name: Med nag - owner medication check-in reminder (10:00 / 22:00 BJT) until checked
        if: always()
        continue-on-error: true
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: curl -s -m 20 "https://ailgns.dev/api/med?nag=1&key=$BACKUP_KEY" | sed 's/"key"[^,}]*//' || true

      - name: Oracle anchor - write today's prediction fingerprint on-chain after 21:00 BJT
        if: always()
        continue-on-error: true
        env:
          POOL_KEY: ${{ secrets.POOL_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u oracle_anchor.py

      - name: Buy back AiLGNS with Anubis income and split 40/30/30
        if: ${{ always() && vars.SPLIT_ON == '1' }}
        continue-on-error: true
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OPS_EMAILS: ${{ secrets.OPS_EMAILS }}
          PYTHONUNBUFFERED: "1"
        run: python -u otc_buyback.py

      - name: EVM arbitrage (OTC <-> DEX, own wallet 0x06cc, min profit 1 DAI; ARB_ON=1 to go live, else dry-run)
        if: always()
        continue-on-error: true
        env:
          ARB_KEY: ${{ secrets.ARB_KEY }}
          ARB_MIN_PROFIT: ${{ vars.ARB_MIN_PROFIT || '1' }}
          ARB_MAX_DAI: ${{ vars.ARB_MAX_DAI || '300' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ vars.ARB_ON }}" = "1" ]; then python -u arb_keeper.py; else python -u arb_keeper.py --dry-run; fi

      - name: Sell Polygon income to DAI and bridge it to Anubis for the buyback
        if: always()
        continue-on-error: true
        env:
          OTC_KEEPER_KEY: ${{ secrets.OTC_KEEPER_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OPS_EMAILS: ${{ secrets.OPS_EMAILS }}
          PYTHONUNBUFFERED: "1"
        run: python -u polygon_bridge.py

      - name: Broadcast OTC orders to DeBox group
        # 营销群只发网站的每小时播报（挂单、好单、成交合成一条，站长要求）；这里只在手动测试时运行
        if: ${{ always() && inputs.debox_test }}
        continue-on-error: true
        env:
          DEBOX_API_KEY: ${{ secrets.DEBOX_API_KEY }}
          DEBOX_API_SECRET: ${{ secrets.DEBOX_API_SECRET }}
          DEBOX_GROUP_ID: ${{ secrets.DEBOX_GROUP_ID }}
          DEBOX_SUMMARY_HOURS: ${{ vars.DEBOX_SUMMARY_HOURS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: python -u otc_debox_broadcast.py ${{ inputs.debox_test && '--test' || '' }}

      - name: Daily KV backup by email (members, VIP transfers, pixel board)
        if: always()
        continue-on-error: true
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: python -u kv_backup.py ${{ inputs.kv_backup && '--force' || '' }}

      - name: Check ailgns.dev for tampering (foreign scripts, unknown addresses)
        if: always()
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: python -u site_guard.py

      - name: Warn when the keeper wallet runs low on gas
        if: always()
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: python -u gas_alert.py

      - name: Save broadcast and fee split state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 一个一个加：某个文件还没生成时（比如 gas_alert.json），不能连累别的状态文件都存不上（之前就因为这样每 5 分钟重发一次邮件）
          for f in data/otc_broadcast.json data/fee_split.json data/buyback.json data/oracle_prize.json data/fast_oracle.json data/kv_backup.json data/site_guard.json data/gas_alert.json data/polygon_bridge.json data/arb.json data/order_seen.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "Update OTC broadcast and fee split state"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done

      - name: Notify order owners on DeBox (fills, cancels, refunds)
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 120 https://ailgns.dev/api/otc-watch || true

      - name: Announce operating-fee payouts to the ops DeBox group
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 120 https://ailgns.dev/api/ops-watch || true

      - name: Loan notices on DeBox (fund/take/repay/default, due reminders, group post)
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 120 https://ailgns.dev/api/loan-watch || true

      - name: Daily stats report to the internal ops DeBox group
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 120 https://ailgns.dev/api/daily-stats || true

      - name: Start big team builds when ailgns.dev needs them
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          due=$(curl -s --max-time 30 https://ailgns.dev/api/bigroots | python -c "import json,sys; print(len(json.load(sys.stdin)['due']))" || echo 0)
          echo "待生成的超大团队：$due"
          [ "$due" = "0" ] && exit 0
          busy=$(gh run list -R "${{ github.repository }}" -w big-team-build.yml --json status -q '[.[] | select(.status != "completed")] | length')
          [ "$busy" != "0" ] && { echo "已经在生成中"; exit 0; }
          gh workflow run big-team-build.yml -R "${{ github.repository }}"

      - name: Pre-build member structure diagrams on ailgns.dev
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 280 https://ailgns.dev/api/refresh || true
