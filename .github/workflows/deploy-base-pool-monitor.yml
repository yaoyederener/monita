name: Verify and configure FTREX BSC funds monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "base-pool-monitor-worker/**"
      - ".github/workflows/deploy-base-pool-monitor.yml"

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: base-pool-monitor-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Securely configure and start the live FTREX Worker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BSC_RPC: ${{ secrets.BSC_RPC }}
          BSCSCAN_KEY: ${{ secrets.BSCSCAN_KEY }}
          WORKER_URL: https://laptop-base-pool-monitor.yaoyederener.workers.dev
        run: node scripts/configure-worker.mjs
